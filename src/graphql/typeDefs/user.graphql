type User {
  id: ID!
  email: String!
  name: String!
  bio: String
  gender: String
  birthDate: String
  photos: [String!]
  latitude: Float
  longitude: Float
  
  isVerified: Boolean
  prompts: String
  jobTitle: String
  company: String
  school: String
  languages: [String!]
  zodiac: String
  familyPlans: String
  covidVaccine: String
  personalityType: String
  communicationStyle: String
  loveStyle: String
  pets: String
  drinking: String
  tags: [String!]

  instagram: String
  snapchat: String
  twitter: String
  showSocials: Boolean

  createdAt: String
  updatedAt: String
  matches1: [Match!]
  matches2: [Match!]
  messages: [Message!]
  posts: [Post!]
  swipesGiven: [Swipe!]
  swipesReceived: [Swipe!]
  tokens: Int
  superlikeTokens: Int
  dmTokens: Int
  rewindTokens: Int
  hasLikedMe: Boolean
  hasSuperlikedMe: Boolean

  lastRewardClaimDate: String
  rewardDayCounter: Int
}

type DailyRewardStatus {
  nextRewardDay: Int!
  canClaimToday: Boolean!
  serverTime: String!
}

type Query {
  users: [User!]
  getProfile(id: ID!, isView: Boolean): User!
  getDailyRewardStatus: DailyRewardStatus!
}

type AuthPayload {
  user: User!
  accessToken: String!
}

type Mutation {
  loginWithGoogle(idToken: String!): AuthPayload!
  createUser(email: String!, password: String!, name: String!): AuthPayload!
  signUp(email: String!, password: String!, name: String!): AuthPayload!
  updateUser(
    id: ID!
    email: String
    password: String
    name: String
    bio: String
    gender: String
    birthDate: String
    photos: [String!]
    latitude: Float
    longitude: Float
    isVerified: Boolean
    prompts: String
    jobTitle: String
    company: String
    school: String
    languages: [String!]
    zodiac: String
    familyPlans: String
    covidVaccine: String
    personalityType: String
    communicationStyle: String
    loveStyle: String
    pets: String
    drinking: String
    tags: [String!]
    instagram: String
    snapchat: String
    twitter: String
    showSocials: Boolean
  ): User!
  logout: Boolean!
  deleteAccount: User!
  addTokens(amount: Int!): User!
  claimDailyReward: User!

  deleteUser(id: ID!): User!
  uploadPhoto(base64: String!): String!
  deletePhoto(url: String!): Boolean!
}